name: iOS build

# Builds an unsigned Expenses.ipa on a GitHub-hosted Mac, for installing with
# Sideloadly and a free Apple ID (see docs/install-on-iphone.md). No Mac or paid
# Apple Developer account needed. Run it from the Actions tab, or with:
#   gh workflow run ios-build.yml
on:
  workflow_dispatch:
  push:
    # Also build every release tag, e.g. `git tag v1.0 && git push --tags`.
    tags: ['v*']

jobs:
  build:
    name: Unsigned IPA
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Select Xcode 26
        # Expo SDK 57 needs Xcode 26.4 or later and does not support Xcode 27 yet.
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate the native iOS project
        run: npx expo prebuild --platform ios --clean
        env:
          CI: 1

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Expenses.xcworkspace \
            -scheme Expenses \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log | grep -E "error:|\*\* BUILD (SUCCEEDED|FAILED)"

      - name: Package the IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/Expenses.app
          # Siri only knows the phrases if Xcode extracted the App Intents metadata.
          if [ -d "$APP/Metadata.appintents" ]; then
            echo "App Intents metadata found: $(ls "$APP/Metadata.appintents")"
          else
            echo "::error::No App Intents metadata in the app bundle, so Siri would not work."
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Expenses.ipa Payload
          ls -lh Expenses.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Expenses-ipa
          path: Expenses.ipa
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 7
